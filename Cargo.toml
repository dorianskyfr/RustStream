[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/telemetry",
    "crates/security",
    "crates/network",
    "crates/capture",
    "crates/codec",
    "crates/input",
    "crates/platform-windows",
    "crates/core",
    "apps/desktop",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dorianskyfr/RustStream"

[workspace.dependencies]
# Internal crates
ruststream-protocol = { path = "crates/protocol" }
ruststream-telemetry = { path = "crates/telemetry" }
ruststream-security = { path = "crates/security" }
ruststream-network = { path = "crates/network" }
ruststream-capture = { path = "crates/capture" }
ruststream-codec = { path = "crates/codec" }
ruststream-input = { path = "crates/input" }
ruststream-platform-windows = { path = "crates/platform-windows" }
ruststream-core = { path = "crates/core" }

# External crates
anyhow = "1"
bytes = "1"
directories = "6"
openh264 = "0.9"
postcard = { version = "1", default-features = false, features = ["use-std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.19"
raw-window-handle = "0.6"
slint-build = "1.19"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Video codecs and pixel conversion are unusable unoptimised; keep dev builds responsive.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.ruststream-codec]
opt-level = 3
