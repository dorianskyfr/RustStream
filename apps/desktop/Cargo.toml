[package]
name = "ruststream-desktop"
description = "RustStream desktop application (host and client)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "ruststream"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ruststream-core.workspace = true
ruststream-protocol.workspace = true
ruststream-telemetry.workspace = true
slint = { workspace = true, features = ["raw-window-handle-06"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
ruststream-input.workspace = true
ruststream-platform-windows.workspace = true
raw-window-handle.workspace = true

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
