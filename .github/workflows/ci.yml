name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows (fmt, clippy, test, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (OpenH264 SIMD)
        run: choco install nasm -y --no-progress
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release --workspace
      - name: Loopback benchmark (synthetic, smoke)
        run: target\release\ruststream-cli.exe bench-loopback --size 1280x720 --fps 60 --seconds 5
      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: ruststream-dev-windows-x64
          path: |
            target/release/ruststream.exe
            target/release/ruststream-cli.exe

  licenses:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
